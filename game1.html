<!DOCTYPE html>
<html>
<head>
  <title>Mat's Backrooms Multiplayer</title>
  <link rel="icon" type="image/png" href="m'b.png">
  <style>
    body { margin: 0; overflow: hidden; }
    canvas { display: block; }

    #crosshair {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: white;
      transform: translate(-50%, -50%);
    }
  </style>
</head>

<body>
<div id="crosshair"></div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.165/build/three.module.js";
import RAPIER from "https://cdn.skypack.dev/@dimforge/rapier3d-compat";

await RAPIER.init();

/* ================= NETWORK ================= */

const ws = new WebSocket("wss://rectal-ascent-grove.ngrok-free.dev");

let myId = null;
let myName = prompt("Enter your name") || "Player";

ws.onopen = () => {
  ws.send(JSON.stringify({
    type: "name",
    name: myName
  }));
};

/* ================= INPUT ================= */

const keys = {};
addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

let yaw = 0;
let pitch = 0;

/* WAYPOINT CREATE KEY */
addEventListener("keydown", (e) => {
  if (e.key.toLowerCase() === "h") {
    const name = prompt("name this waypoint");
    if (!name) return;

    const t = playerBody.translation();

    ws.send(JSON.stringify({
      type: "waypoint",
      x: t.x,
      y: t.y,
      z: t.z,
      name
    }));
  }
});

/* ================= THREE ================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87a8c4);
scene.fog = new THREE.Fog(0x87a8c4, 5, 120);

scene.add(new THREE.AmbientLight(0xffffff, 0.7));

const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(10, 20, 10);
scene.add(sun);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.rotation.order = "YXZ";

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

/* ================= PHYSICS ================= */

const world = new RAPIER.World({ x: 0, y: -9.81, z: 0 });

const playerBody = world.createRigidBody(
  RAPIER.RigidBodyDesc.dynamic().setTranslation(0, 2, 0)
);

world.createCollider(
  RAPIER.ColliderDesc.capsule(0.5, 1),
  playerBody
);

/* ================= MAP (UNCHANGED) ================= */

function box(x,y,z,sx,sy,sz,color){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(sx*2, sy*2, sz*2),
    new THREE.MeshStandardMaterial({ color })
  );

  mesh.position.set(x,y,z);
  scene.add(mesh);

  world.createCollider(
    RAPIER.ColliderDesc.cuboid(sx,sy,sz).setTranslation(x,y,z)
  );
}

/* FLOOR */
box(0,-1,0,1000,0.5,1000,0x9e982b);

const wallcolour = 0xede321;

const CHUNK = 70;

function buildChunk(offX, offZ) {

  box(0 + offX, 0, -10 + offZ, 10, 4, 0.5, wallcolour);
  box(0 + offX, 0, 10 + offZ, 15, 4, 0.5, wallcolour);
  box(10 + offX, 0, 0 + offZ, 0.5, 4, 10, wallcolour);
  box(-20 + offX, 0, 0 + offZ, 5, 4, 0.5, wallcolour);
  box(-20 + offX, 0, 0 + offZ, 0.5, 4, 5, wallcolour);
  box(10 + offX, 0, 15 + offZ, 20, 4, 0.5, wallcolour);
  box(20 + offX, 0, 0 + offZ, 0.5, 4, 10, wallcolour);
  box(0 + offX, 0, -18 + offZ, 10, 4, 0.5, wallcolour);
  box(-15 + offX, 0, -10 + offZ, 8, 4, 0.5, wallcolour);
  box(20 + offX, 0, -30 + offZ, 20, 4, 0.5, wallcolour);
  box(20 + offX, 0, -30 + offZ, 0.5, 4, 10, wallcolour);
  box(-20 + offX, 0, -30 + offZ, 10, 4, 0.5, wallcolour);
  box(-20 + offX, 0, -30 + offZ, 0.5, 4, 10, wallcolour);
  box(-25 + offX, 0, 30 + offZ, 0.5, 4, 10, wallcolour);
  box(-25 + offX, 0, 40 + offZ, 10, 4, 0.5, wallcolour);
  box(-40 + offX, 0, 30 + offZ, 0.5, 4, 20, wallcolour);
  box(-40 + offX, 0, 30 + offZ, 10, 4, 0.5, wallcolour);
  box(-45 + offX, 0, 0 + offZ, 0.5, 4, 5, wallcolour);
  box(-45 + offX, 0, -15 + offZ, 5, 4, 0.5, wallcolour);
  box(-45 + offX, 0, -20 + offZ, 10, 4, 0.5, wallcolour);
  box(-58 + offX, 0, -10 + offZ, 0.5, 4, 10, wallcolour);
  box(-58 + offX, 0, 15 + offZ, 0.5, 4, 10, wallcolour);
  box(-65 + offX, 0, 15 + offZ, 10, 4, 0.5, wallcolour);

  box(30 + offX, 0, 15 + offZ, 0.5, 4, 10, wallcolour);
  box(30 + offX, 0, 15 + offZ, 5, 4, 0.5, wallcolour);
  box(10 + offX, 0, 15 + offZ, 5, 4, 0.5, wallcolour);
  box(10 + offX, 0, 30 + offZ, 0.5, 4, 10, wallcolour);
  box(30 + offX, 0, 50 + offZ, 0.5, 4, 10, wallcolour);
  box(30 + offX, 0, 0 + offZ, 10, 4, 0.5, wallcolour);
  box(30 + offX, 0, -40 + offZ, 10, 4, 0.5, wallcolour);
  box(-40 + offX, 0, -40 + offZ, 0.5, 4, 8, wallcolour);
}

const RANGE = 5;

for (let x = -RANGE; x <= RANGE; x++) {
  for (let z = -RANGE; z <= RANGE; z++) {
    buildChunk(x * CHUNK, z * CHUNK);
  }
}

box(0,4,0,1000,1,1000,0x8f8f8f);

/* ================= REMOTES ================= */

const remote = {};

function createRemote(){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(1,2,1),
    new THREE.MeshStandardMaterial({ color: 0xffcc00 })
  );
  scene.add(mesh);

  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 128;

  const ctx = canvas.getContext("2d");
  const tex = new THREE.CanvasTexture(canvas);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: tex,
      transparent: true,
      depthTest: false
    })
  );

  sprite.scale.set(4,2,1);
  scene.add(sprite);

  return {
    mesh,
    sprite,
    ctx,
    tex,
    target: new THREE.Vector3(),
    name: "Player"
  };
}

/* ================= WAYPOINTS ================= */

const waypoints = {};

function createWaypoint(){
  const mesh = new THREE.Mesh(
    new THREE.BoxGeometry(0.25,1.5,0.25),
    new THREE.MeshStandardMaterial({
      color: 0x00aaff,
      fog: false
    })
  );

  scene.add(mesh);

  const canvas = document.createElement("canvas");
  canvas.width = 256;
  canvas.height = 128;

  const ctx = canvas.getContext("2d");
  const tex = new THREE.CanvasTexture(canvas);

  const sprite = new THREE.Sprite(
    new THREE.SpriteMaterial({
      map: tex,
      transparent: true,
      depthTest: false,
      fog: false
    })
  );

  sprite.scale.set(4,2,1);
  scene.add(sprite);

  return { mesh, sprite, ctx, tex, name: "" };
}

/* ================= NETWORK ================= */

ws.onmessage = (msg) => {
  const data = JSON.parse(msg.data);

  if (data.type === "id") {
    myId = data.id;
  }

  if (data.type === "state") {

    for (const id in data.players) {
      if (id === myId) continue;

      if (!remote[id]) remote[id] = createRemote();

      remote[id].target.set(
        data.players[id].x,
        data.players[id].y,
        data.players[id].z
      );

      remote[id].name = data.players[id].name;
    }

    for (const id in remote) {
      if (!data.players[id]) {
        scene.remove(remote[id].mesh);
        scene.remove(remote[id].sprite);
        delete remote[id];
      }
    }

    for (const id in data.waypoints) {

      if (!waypoints[id]) {
        waypoints[id] = createWaypoint();
      }

      waypoints[id].mesh.position.set(
        data.waypoints[id].x,
        data.waypoints[id].y - 0.75,
        data.waypoints[id].z
      );

      waypoints[id].name = data.waypoints[id].name;
    }
  }
};

/* ================= SEND ================= */

function send(){
  if (ws.readyState !== 1) return;

  const t = playerBody.translation();

  ws.send(JSON.stringify({
    type: "pos",
    x: t.x,
    y: t.y,
    z: t.z
  }));
}

/* ================= LOOP ================= */

function animate() {
  requestAnimationFrame(animate);

  world.step();

  /* ================= LOOK ================= */

  const lookSpeed = 0.02;

  if (keys["arrowleft"]) yaw += lookSpeed;
  if (keys["arrowright"]) yaw -= lookSpeed;
  if (keys["arrowup"]) pitch += lookSpeed;
  if (keys["arrowdown"]) pitch -= lookSpeed;

  pitch = Math.max(-1.5, Math.min(1.5, pitch));
  camera.rotation.set(pitch, yaw, 0);

  /* ================= MOVE ================= */

  const vel = playerBody.linvel();

  const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));

  let vx = 0, vz = 0;

  if (keys["w"]) { vx -= forward.x * 2; vz -= forward.z * 2; }
  if (keys["s"]) { vx += forward.x * 2; vz += forward.z * 2; }
  if (keys["a"]) { vx -= right.x * 2; vz -= right.z * 2; }
  if (keys["d"]) { vx += right.x * 2; vz += right.z * 2; }

  playerBody.setLinvel({ x: vx, y: vel.y, z: vz }, true);

  if (keys[" "] && Math.abs(vel.y) < 0.05) {
    playerBody.setLinvel({ x: vel.x, y: 6, z: vel.z }, true);
  }

  /* ================= CAMERA ================= */

  const pos = playerBody.translation();
  camera.position.set(pos.x, pos.y + 0.8, pos.z);

  send();

  /* ================= REMOTES ================= */

  for (const id in remote) {
    const p = remote[id];

    p.mesh.position.lerp(p.target, 0.25);

    const labelPos = new THREE.Vector3(
      p.mesh.position.x,
      p.mesh.position.y + 1.6,
      p.mesh.position.z
    );

    p.sprite.position.copy(labelPos);

    // face camera
    p.sprite.quaternion.copy(camera.quaternion);

    // fixed readable size
    const dist = camera.position.distanceTo(p.mesh.position);
    const scale = Math.max(2.5, dist * 0.12);
    p.sprite.scale.set(scale, scale * 0.5, 1);

    const ctx = p.ctx;
    ctx.clearRect(0, 0, 256, 128);
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(20, 20, 216, 70);

    ctx.fillStyle = "white";
    ctx.font = "28px Arial";
    ctx.textAlign = "center";
    ctx.fillText(p.name, 128, 65);

    p.tex.needsUpdate = true;
  }

  /* ================= WAYPOINTS ================= */

  for (const id in waypoints) {
    const w = waypoints[id];

    const wpPos = new THREE.Vector3(
      w.mesh.position.x,
      w.mesh.position.y,
      w.mesh.position.z
    );

    w.sprite.position.copy(wpPos);

    // face camera so it’s always readable
    w.sprite.quaternion.copy(camera.quaternion);

    // NO SHRINKING BELOW THIS SIZE
    const dist = camera.position.distanceTo(w.mesh.position);
    const scale = Math.max(3, dist * 0.10);
    w.sprite.scale.set(scale, scale * 0.5, 1);

    const ctx = w.ctx;
    ctx.clearRect(0, 0, 256, 128);

    ctx.fillStyle = "rgba(0,120,255,0.6)";
    ctx.fillRect(20, 20, 216, 70);

    ctx.fillStyle = "white";
    ctx.font = "bold 28px Arial";
    ctx.textAlign = "center";
    ctx.fillText(w.name || "Waypoint", 128, 65);

    w.tex.needsUpdate = true;
  }

  renderer.render(scene, camera);
}

animate();

</script>
</body>
</html>
